{% extends "base.html" %}

{% block title %}Login - SmartCart{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center my-5">
    <div class="card p-4 shadow-sm border-0" style="max-width: 420px; width: 100%; border-radius: 24px; background: #ffffff;">
        <div class="text-center mb-4">
            <span style="font-size: 40px;">🌱</span>
            <h3 class="fw-bold mt-2" style="color: #1a202c;">Welcome back!</h3>
            <p class="text-muted small">Log in to manage your SmartCart orders</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email</label>
                <input type="email" name="email" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="name@example.com" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <input type="password" name="password" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-add-cart py-2 fw-bold mb-3">Login ➔</button>
        </form>

        <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="fw-bold small text-success text-decoration-none ms-1">Register here</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Dashboard - SmartCart{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <h2 class="fw-bold mb-4" style="color: #1a202c;">📊 Admin Analytics Dashboard</h2>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white text-center">
                    <h6 class="text-muted fw-semibold">Total Products</h6>
                    <h2 class="fw-bold text-success mt-2">12</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white text-center">
                    <h6 class="text-muted fw-semibold">Active Users</h6>
                    <h2 class="fw-bold text-success mt-2">5</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white text-center">
                    <h6 class="text-muted fw-semibold">Store Status</h6>
                    <h2 class="fw-bold text-success mt-2">Online 🌿</h2>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

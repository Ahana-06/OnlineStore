<div class="card product-card border-0 shadow-sm rounded-4 p-3 h-100 bg-white">
    <!-- Product Image & Details -->
    <div class="text-center position-relative mb-3">
        <img src="{{ product.image_url or url_for('static', filename='img/default_product.png') }}" class="img-fluid rounded-3" style="height: 140px; object-fit: contain;" alt="{{ product.name }}">
    </div>
    
    <div class="card-body p-0 d-flex flex-column">
        <h6 class="fw-bold mb-1" style="color: #1a202c;">{{ product.name }}</h6>
        <p class="text-muted small mb-2">{{ product.unit or '1 unit' }}</p>
        
        <div class="d-flex align-items-center justify-content-between mt-auto pt-2">
            <span class="fw-bold fs-5" style="color: #1a202c;">₹{{ product.price|int }}</span>
            
            <!-- Blinkit-Style Dynamic Action Area -->
            <div id="product-action-{{ product.id }}">
                {% if product.id in cart_product_ids %}
                    <!-- Quantity Stepper if already in cart -->
                    <div class="d-flex align-items-center bg-success text-white rounded-pill px-2 py-1" style="background-color: #2e7d32 !important;">
                        <button class="btn btn-sm text-white px-2 py-0 border-0 shadow-none" onclick="updateCart({{ product.id }}, 'decrease')">-</button>
                        <span class="mx-2 fw-bold small" id="qty-{{ product.id }}">1</span>
                        <button class="btn btn-sm text-white px-2 py-0 border-0 shadow-none" onclick="updateCart({{ product.id }}, 'increase')">+</button>
                    </div>
                {% else %}
                    <!-- Add Button -->
                    <button onclick="addToCart({{ product.id }})" class="btn btn-sm text-white fw-semibold rounded-pill px-4 py-2" style="background-color: #2e7d32; transition: all 0.2s ease;">
                        Add 🛒
                    </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h2 class="mb-3">Create account</h2>
  <form method="post" class="card card-body">
    <label class="form-label">Name</label>
    <input class="form-control mb-3" name="name" required>
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password (6+ characters)</label>
    <input class="form-control mb-3" type="password" name="password" minlength="6" required>
    <label class="form-label">I want to</label>
    <select class="form-select mb-3" name="role">
      <option value="customer">Buy products</option>
      <option value="seller">Sell products</option>
    </select>
    <button class="btn btn-dark">Register</button>
  </form>
</div></div>
{% endblock %}

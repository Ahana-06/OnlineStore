{% extends "base.html" %}

{% block title %}Register - SmartCart{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center my-5">
    <div class="card p-4 shadow-sm border-0" style="max-width: 420px; width: 100%; border-radius: 24px; background: #ffffff;">
        <div class="text-center mb-4">
            <span style="font-size: 40px;">✨</span>
            <h3 class="fw-bold mt-2" style="color: #1a202c;">Create an Account</h3>
            <p class="text-muted small">Join SmartCart and start shopping today</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Username</label>
                <input type="text" name="username" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email</label>
                <input type="email" name="email" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="name@example.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <input type="password" name="password" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-add-cart py-2 fw-bold mb-3">Register ➔</button>
        </form>

        <div class="text-center">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="fw-bold small text-success text-decoration-none ms-1">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
